    <text x="62" y="450" fill="#202124" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="62" dy="0">Quick one —</tspan><tspan x="62" dy="48.24"></tspan><tspan x="62" dy="48.24">A busy factory can still be a leaking factory.</tspan><tspan x="62" dy="48.24"></tspan><tspan x="62" dy="48.24">Before you add another shift, find the first</tspan><tspan x="62" dy="48.24">leak and the fix that recovers profit fastest.</tspan><tspan x="62" dy="48.24"></tspan><tspan x="62" dy="48.24">I mapped the checks. Takes 30 seconds.</tspan><tspan x="62" dy="48.24"></tspan><tspan x="62" dy="48.24">Bernard</tspan></text>
    <rect x="62" y="1135" width="142" height="64" rx="26" fill="#f1f3f4"/>
