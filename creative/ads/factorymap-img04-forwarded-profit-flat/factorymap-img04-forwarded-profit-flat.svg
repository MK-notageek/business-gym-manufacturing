    <text x="100" y="480" fill="#1f2937" font-family="Arial" font-size="31" font-weight="400" text-anchor="start" letter-spacing="0"><tspan x="100" dy="0">Quick one —</tspan><tspan x="100" dy="44.019999999999996"></tspan><tspan x="100" dy="44.019999999999996">A busy factory can still be a leaking</tspan><tspan x="100" dy="44.019999999999996">factory.</tspan><tspan x="100" dy="44.019999999999996"></tspan><tspan x="100" dy="44.019999999999996">Before you add another shift, find the</tspan><tspan x="100" dy="44.019999999999996">#1 leak and the fix that recovers profit</tspan><tspan x="100" dy="44.019999999999996">fastest.</tspan><tspan x="100" dy="44.019999999999996"></tspan><tspan x="100" dy="44.019999999999996">I mapped the checks. Takes 30 seconds.</tspan></text>
